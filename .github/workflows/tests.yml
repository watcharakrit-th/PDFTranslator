# Lint and the full test suite on Linux, against PostgreSQL + pgvector (no GPU needed:
# the tests use a fake translator and a fake embedder).
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pdftr
          POSTGRES_PASSWORD: pdftr
          POSTGRES_DB: pdftr
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U pdftr -d pdftr"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet uv
          . scripts/env.sh
          uv sync --group dev --python "$(which python)"
      - name: Lint
        run: |
          .venv/bin/ruff check src tests
          .venv/bin/ruff format --check src tests
      - name: Tests
        run: |
          . scripts/env.sh
          .venv/bin/python -m pytest -q -p no:cacheprovider
